name: Cron - Snapshot

on:
  schedule:
    # Toutes les heures (à HH:00 UTC). Le snapshot s'upsert sur [assetId, date du
    # jour UTC] : chaque run écrase la valeur du jour avec le dernier prix valide.
    # Plus de runs = courbe plus fraîche + meilleure résilience aux blips Yahoo
    # (un prix 0/échec est désormais skippé, donc un bon run suivant garde la main).
    # Reste dans le gratuit : Yahoo public (qq appels/h), CoinGecko demo (~720/mois),
    # GitHub Actions (~720 min/mois < 2000).
    - cron: "0 * * * *"
  workflow_dispatch: # trigger manuel via Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit cron endpoint
        run: |
          curl -sfS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/snapshot"
