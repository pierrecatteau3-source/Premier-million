name: Desktop release

# Build automatique de l'installeur Windows et publication dans la Release
# correspondante. Declenche en poussant un tag `desktop-v*` (ex: desktop-v0.1.1).
#
#   git tag desktop-v0.1.1 && git push origin desktop-v0.1.1
#
# Le runner windows-latest dispose du privilege de creation de symlinks, donc
# pas besoin du contournement winCodeSign necessaire en local.

on:
  push:
    tags:
      - "desktop-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run dist

      - name: Publish installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" \
            || gh release create "${{ github.ref_name }}" \
                 --title "App bureau Windows — ${{ github.ref_name }}" \
                 --notes "Build automatique de l'installeur Windows."
          gh release upload "${{ github.ref_name }}" \
            "desktop/dist/Premier-Million-Setup.exe" --clobber
