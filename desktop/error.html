<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion impossible — Premier Million</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #0b0b0f;
        color: #e7e7ea;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .box {
        max-width: 460px;
        padding: 32px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      p {
        color: #9a9aa3;
        line-height: 1.5;
        margin: 0 0 24px;
        font-size: 14px;
      }
      button {
        background: #d4af37;
        color: #0b0b0f;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.07);
      }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        color: #6b6b73;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Connexion impossible</h1>
      <p>
        Impossible de joindre Premier Million. Verifie ta connexion internet,
        puis reessaie.
      </p>
      <button id="retry">Reessayer</button>
      <div class="hint">
        Nouvelle tentative automatique dans <span id="c">8</span> s…
      </div>
    </div>
    <script>
      const target = new URLSearchParams(location.search).get("target");
      function retry() {
        if (target) location.href = target;
      }
      document.getElementById("retry").addEventListener("click", retry);
      let n = 8;
      const el = document.getElementById("c");
      const t = setInterval(() => {
        n -= 1;
        el.textContent = n;
        if (n <= 0) {
          clearInterval(t);
          retry();
        }
      }, 1000);
    </script>
  </body>
</html>
